<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noro Manga — نورو مانجا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="mark">ن</div>
    <div>
      Noro Manga
      <small>NOROMANGA.READER</small>
    </div>
  </div>
  <nav>
    <a href="index.html" class="active">الرئيسية</a>
    <a href="#grid">كل الأعمال</a>
  </nav>
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="ابحث عن عمل...">
  </div>
</header>

<section class="hero">
  <div class="hero-eyebrow">مانجا · مانهوا · مباشر</div>
  <h1>اقرأ أحدث فصول المانجا والمانهوا المفضلة لديك</h1>
  <p>مكتبة تُحدَّث باستمرار — كل عمل يحمل ختمه الخاص: مستمر أو متوقف.</p>
</section>

<section class="section" id="grid">
  <div class="section-head">
    <h2>كل الأعمال</h2>
    <span id="countLabel">...</span>
  </div>
  <div class="grid" id="worksGrid">
    <div class="loading">جاري تحميل الأعمال...</div>
  </div>
</section>

<footer class="site-footer">Noro Manga — جميع الحقوق محفوظة</footer>

<script>
async function loadWorks(){
  const grid = document.getElementById('worksGrid');
  const countLabel = document.getElementById('countLabel');
  try{
    const res = await fetch('mangamanhwa/works.json');
    const works = await res.json();
    countLabel.textContent = works.length + ' عمل';

    const render = (list) => {
      if(!list.length){
        grid.innerHTML = '<div class="empty-state">لا توجد نتائج مطابقة</div>';
        return;
      }
      grid.innerHTML = list.map(w => `
        <a class="card" href="mangamanhwa/${encodeURIComponent(w.folder)}/${encodeURIComponent(w.folder)}.html">
          <div class="cover-wrap">
            <span class="stamp ${w.status}">${w.status === 'ongoing' ? 'مستمر' : 'متوقف'}</span>
            <span class="type-chip">${w.type}</span>
            <img src="${w.cover}" alt="${w.title}" loading="lazy">
          </div>
          <div class="body">
            <div class="title">${w.title}</div>
            <div class="meta">${w.chapters_count} فصل</div>
          </div>
        </a>
      `).join('');
    };

    render(works);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim();
      render(works.filter(w => w.title.includes(q)));
    });

  }catch(err){
    grid.innerHTML = '<div class="empty-state">تعذّر تحميل قائمة الأعمال (mangamanhwa/works.json)</div>';
    console.error(err);
  }
}
loadWorks();
</script>

</body>
</html>
