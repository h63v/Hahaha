<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="MangaX - مكتبة مانجا عربية">
<title>MangaX — مكتبة المانجا</title><link rel="stylesheet" href="style.css">
</head><body>
<header class="site-header"><div class="container header-inner">
<a class="logo" href="index.html"><span>Manga</span>X</a>
<nav><a class="active" href="index.html">الرئيسية</a><a href="#library">المكتبة</a></nav>
</div></header>
<section class="hero"><div class="container hero-inner">
<span class="eyebrow">MANGA LIBRARY</span>
<h1>عالمك من<br><span>المانجا.</span></h1>
<p>اكتشف أعمالك المفضلة واقرأ الفصول بواجهة سريعة وأنيقة، مصممة لتعمل بشكل ممتاز على الهاتف والكمبيوتر.</p>
<div class="hero-actions"><a class="primary-btn" href="#library">استكشف المكتبة</a><a class="ghost-btn" href="#library">جميع الأعمال</a></div>
</div></section>
<main id="library" class="container library">
<div class="section-head"><div><span class="eyebrow">LIBRARY</span><h2>آخر الأعمال</h2></div><span id="count" class="muted">0 عمل</span></div>
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" placeholder="ابحث عن عمل، تصنيف..." autocomplete="off"></label>
<div class="filters"><button class="filter active" data-status="all">الكل</button><button class="filter" data-status="ongoing">مستمر</button><button class="filter" data-status="completed">مكتمل</button><button class="filter" data-status="paused">متوقف</button></div></div>
<div id="works" class="works"></div><div id="empty" class="empty" hidden>لا توجد نتائج مطابقة.</div>
</main>
<footer><div class="container footer-inner"><strong><span>Manga</span>X</strong><span>© 2026 MangaX</span></div></footer>
<script src="script.js"></script></body></html>
