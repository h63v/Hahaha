<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MangaX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a class="logo" href="index.html"><span>Manga</span>X</a>
<nav><a class="active" href="index.html">الرئيسية</a><a href="#library">المكتبة</a></nav>
</div></header>

<section class="hero"><div class="container hero-inner">
<span class="eyebrow">MANGA LIBRARY</span>
<h1>اقرأ أعمالك<br><span>بطريقتك.</span></h1>
<p>مكتبة مانجا بسيطة وسريعة، مع صفحات أعمال وقارئ فصول متجاوب مع الجوال والكمبيوتر.</p>
<a class="primary-btn" href="#library">استكشف المكتبة</a>
</div></section>

<main id="library" class="container library">
<div class="section-head"><div><span class="eyebrow">LIBRARY</span><h2>الأعمال</h2></div><span id="count" class="muted">0 عمل</span></div>
<div class="toolbar">
<label class="search"><span>⌕</span><input id="search" placeholder="ابحث عن عمل..." autocomplete="off"></label>
<div class="filters">
<button class="filter active" data-status="all">الكل</button>
<button class="filter" data-status="ongoing">مستمر</button>
<button class="filter" data-status="completed">مكتمل</button>
<button class="filter" data-status="paused">متوقف</button>
</div></div>
<div id="works" class="works"></div><div id="empty" class="empty" hidden>لا توجد نتائج مطابقة.</div>
</main>
<footer><div class="container footer-inner"><strong><span>Manga</span>X</strong><span>© 2026 MangaX</span></div></footer>
<script src="script.js"></script>
</body></html>
