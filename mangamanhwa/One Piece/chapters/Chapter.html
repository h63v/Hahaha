<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">جاري التحميل... — Noro Manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>

<div class="reader-bar">
  <div>
    <div class="work-name" id="workNameLabel">...</div>
    <div class="ch-title" id="chapterTitleLabel">...</div>
  </div>
  <div class="reader-nav">
    <button id="prevBtn" disabled>الفصل السابق ←</button>
    <a id="backToWork" href="#">صفحة العمل</a>
    <button id="nextBtn" disabled>→ الفصل التالي</button>
  </div>
</div>

<div class="reader-pages" id="pagesContainer">
  <div class="loading">جاري تحميل صفحات الفصل...</div>
</div>

<div class="reader-end" id="readerEnd" style="display:none;">
  <p>انتهى الفصل</p>
  <div class="cta-row" style="justify-content:center; display:flex;">
    <button class="btn primary" id="nextBtnBottom">الفصل التالي</button>
    <a class="btn ghost" id="backToWorkBottom" href="#">كل الفصول</a>
  </div>
</div>

<script>
/*
  هذا الملف قالب واحد يُستخدم لعرض جميع فصول هذا العمل.
  يقرأ من رابط الصفحة: ?work=اسم%20مجلد%20العمل&ch=رقم%20الفصل
  مثال: chapters/Chapter.html?work=One%20Piece&ch=1

  البنية المتوقعة:
  mangamanhwa/[العمل]/chapters.json                <- قائمة الفصول
  mangamanhwa/[العمل]/chapters/[رقم الفصل]/images.json <- ترتيب صور الفصل
  mangamanhwa/[العمل]/chapters/[رقم الفصل]/1.jpg, 2.jpg ...
*/

const params = new URLSearchParams(window.location.search);
const workFolder = params.get('work');
const chNumber = parseInt(params.get('ch'), 10);

const pagesContainer = document.getElementById('pagesContainer');
const workNameLabel = document.getElementById('workNameLabel');
const chapterTitleLabel = document.getElementById('chapterTitleLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const nextBtnBottom = document.getElementById('nextBtnBottom');
const backToWork = document.getElementById('backToWork');
const backToWorkBottom = document.getElementById('backToWorkBottom');
const readerEnd = document.getElementById('readerEnd');

function chapterUrl(n){
  return `Chapter.html?work=${encodeURIComponent(workFolder)}&ch=${n}`;
}

async function init(){
  if(!workFolder || !chNumber){
    pagesContainer.innerHTML = '<div class="empty-state">رابط غير صالح — يجب تحديد work و ch</div>';
    return;
  }

  backToWork.href = `../${encodeURIComponent(workFolder)}.html`;
  backToWorkBottom.href = `../${encodeURIComponent(workFolder)}.html`;

  try{
    // .. لأن هذا الملف داخل مجلد chapters/ وneed الرجوع لمجلد العمل
    const metaRes = await fetch('../chapters.json');
    const meta = await metaRes.json();
    const sorted = [...meta.chapters].sort((a,b) => a.number - b.number);
    const idx = sorted.findIndex(c => c.number === chNumber);
    const current = sorted[idx];

    if(!current){
      pagesContainer.innerHTML = '<div class="empty-state">هذا الفصل غير موجود</div>';
      return;
    }

    workNameLabel.textContent = meta.title;
    chapterTitleLabel.textContent = current.title;
    document.getElementById('pageTitle').textContent = `${current.title} — ${meta.title} — Noro Manga`;

    const prev = sorted[idx - 1];
    const next = sorted[idx + 1];

    if(prev){ prevBtn.disabled = false; prevBtn.onclick = () => location.href = chapterUrl(prev.number); }
    if(next){
      nextBtn.disabled = false;
      nextBtn.onclick = () => location.href = chapterUrl(next.number);
      nextBtnBottom.onclick = () => location.href = chapterUrl(next.number);
      nextBtnBottom.textContent = 'الفصل التالي';
    } else {
      nextBtnBottom.textContent = 'هذا آخر فصل';
      nextBtnBottom.disabled = true;
    }

    // تحميل صور الفصل
    const imgRes = await fetch(`${current.folder}/images.json`);
    const imgData = await imgRes.json();

    if(!imgData.images || !imgData.images.length){
      pagesContainer.innerHTML = '<div class="empty-state">لا توجد صور في هذا الفصل</div>';
      return;
    }

    pagesContainer.innerHTML = imgData.images.map((file, i) => `
      <img src="${current.folder}/${file}" alt="صفحة ${i + 1}" loading="lazy">
    `).join('');

    readerEnd.style.display = 'block';

  }catch(err){
    pagesContainer.innerHTML = '<div class="empty-state">تعذّر تحميل بيانات الفصل</div>';
    console.error(err);
  }
}

init();
</script>

</body>
</html>
