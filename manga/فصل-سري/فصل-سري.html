<script>

const INDEX_URL = "/manga/index.json";


/* =========================================================
   ELEMENTS
========================================================= */

const chaptersContainer =
    document.getElementById("chapters");

const chapterCount =
    document.getElementById("chapterCount");


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character])
        );

}


/*
 * توحيد النص العربي قبل المقارنة
 */

function normalizeText(value) {

    return String(value ?? "")
        .trim()
        .normalize("NFC")
        .toLowerCase();

}


/* =========================================================
   GET WORK FROM URL
========================================================= */

/*
 * إذا كان الرابط مثل:

   /manga/فصل-سري/فصل-سري.html

 * سيأخذ:

   فصل-سري

 * تلقائيًا.
 */

function getSlugFromURL() {

    const pathname =
        decodeURIComponent(
            window.location.pathname
        );

    const parts =
        pathname
            .split("/")
            .filter(Boolean);


    const mangaIndex =
        parts.findIndex(
            part =>
                normalizeText(part) === "manga"
        );


    if (
        mangaIndex !== -1 &&
        parts[mangaIndex + 1]
    ) {

        return parts[mangaIndex + 1];

    }


    return "";

}


/* =========================================================
   FIND WORK
========================================================= */

function findWork(works) {

    const urlSlug =
        normalizeText(
            getSlugFromURL()
        );


    /*
     * اسم الملف الحالي
     */

    const currentFile =
        decodeURIComponent(
            window.location.pathname
                .split("/")
                .pop() || ""
        );


    const normalizedFile =
        normalizeText(
            currentFile
        );


    /*
     * 1 - البحث بالـ slug الموجود في الرابط
     */

    let work =
        works.find(
            item =>
                normalizeText(
                    item.slug
                ) === urlSlug
        );


    if (work) {
        return work;
    }


    /*
     * 2 - البحث باسم الملف
     */

    work =
        works.find(
            item =>
                normalizeText(
                    item.file
                ) === normalizedFile
        );


    if (work) {
        return work;
    }


    /*
     * 3 - البحث باسم العمل
     */

    work =
        works.find(
            item =>
                normalizeText(
                    item.title
                ) === urlSlug
        );


    if (work) {
        return work;
    }


    /*
     * 4 - بحث إضافي:
     * إذا كان الرابط لا يحتوي على /manga/ بالشكل المتوقع
     */

    work =
        works.find(item => {

            const slug =
                normalizeText(
                    item.slug
                );

            const file =
                normalizeText(
                    item.file
                );

            const title =
                normalizeText(
                    item.title
                );


            return (
                slug === urlSlug ||
                file === normalizedFile ||
                title === urlSlug
            );

        });


    return work || null;

}


/* =========================================================
   LOAD INDEX.JSON
========================================================= */

async function loadChapters() {

    try {

        if (!chaptersContainer) {
            return;
        }


        /*
         * تحميل index.json بدون كاش
         */

        const response =
            await fetch(
                `${INDEX_URL}?v=${Date.now()}`,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Cache-Control": "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                `تعذر تحميل index.json - HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
         * التأكد من صحة JSON
         */

        if (
            !data ||
            !Array.isArray(data.works)
        ) {

            throw new Error(
                "index.json لا يحتوي على works بشكل صحيح."
            );

        }


        /*
         * البحث عن العمل
         */

        const work =
            findWork(
                data.works
            );


        /*
         * إذا لم يتم العثور عليه
         */

        if (!work) {

            const availableWorks =
                data.works
                    .map(
                        item =>
                            item.slug ||
                            item.title ||
                            item.file ||
                            "بدون اسم"
                    )
                    .join(" ، ");


            throw new Error(
                `لم يتم العثور على العمل.

العمل المطلوب من الرابط:
${getSlugFromURL() || "غير معروف"}

الأعمال الموجودة:
${availableWorks || "لا يوجد"}`
            );

        }


        console.log(
            "MangaX - تم العثور على العمل:",
            work
        );


        /* =====================================================
           CHAPTERS
        ===================================================== */

        let chapters = [];


        /*
         * إذا كان:

         "chapters": 310

         ننشئ تلقائيًا:

         1 إلى 310
         */

        if (
            typeof work.chapters === "number"
        ) {

            const total =
                Math.max(
                    0,
                    Math.floor(
                        work.chapters
                    )
                );


            chapters =
                Array.from(
                    {
                        length: total
                    },
                    (_, index) =>
                        index + 1
                );

        }


        /*
         * إذا كان chapters مصفوفة
         */

        else if (
            Array.isArray(
                work.chapters
            )
        ) {

            chapters =
                work.chapters
                    .map(
                        chapter => {

                            /*
                             * إذا كان:

                             {"number": 5}
                             */

                            if (
                                typeof chapter ===
                                    "object"
                                &&
                                chapter !== null
                            ) {

                                return Number(
                                    chapter.number
                                );

                            }


                            /*
                             * إذا كان:

                             5
                             */

                            return Number(
                                chapter
                            );

                        }
                    )
                    .filter(
                        number =>
                            Number.isFinite(
                                number
                            )
                            &&
                            number > 0
                    );

        }


        /*
         * إزالة التكرار
         */

        chapters =
            [
                ...new Set(
                    chapters
                )
            ];


        /*
         * ترتيب من الأحدث إلى الأقدم
         */

        chapters.sort(
            (a, b) =>
                b - a
        );


        /*
         * عرض الفصول
         */

        renderChapters(
            work,
            chapters
        );

    }


    catch (error) {

        console.error(
            "MangaX:",
            error
        );


        if (chapterCount) {

            chapterCount.textContent =
                "خطأ";

        }


        if (chaptersContainer) {

            chaptersContainer.innerHTML = `

                <div class="empty">

                    ❌ تعذر تحميل الفصول

                    <br><br>

                    <small style="
                        white-space: pre-line;
                        line-height: 2;
                    ">
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                </div>

            `;

        }

    }

}


/* =========================================================
   RENDER CHAPTERS
========================================================= */

function renderChapters(
    work,
    chapters
) {

    if (!chapterCount) {
        return;
    }


    chapterCount.textContent =
        `${chapters.length} فصل`;


    if (!chapters.length) {

        chaptersContainer.innerHTML = `

            <div class="empty">

                لا توجد فصول حاليًا.

            </div>

        `;

        return;
    }


    /*
     * استخدام slug الموجود فعليًا
     * في index.json
     */

    const slug =
        String(
            work.slug || ""
        ).trim();


    /*
     * إنشاء روابط الفصول
     */

    chaptersContainer.innerHTML =
        chapters
            .map(
                number => {

                    /*
                     * اسم ملف الفصل:

                     فصل-سري-chapter-310.html
                     */

                    const filename =
                        `${slug}-chapter-${number}.html`;


                    /*
                     * الرابط:

                     /manga/فصل-سري/
                     فصل-سري-chapter-310.html
                     */

                    const url =
                        `/manga/` +
                        `${encodeURIComponent(slug)}/` +
                        `${encodeURIComponent(filename)}`;


                    return `

                        <a
                            class="chapter"
                            href="${url}"
                        >

                            <span
                                class="chapter-number"
                            >
                                الفصل ${number}
                            </span>


                            <span
                                class="chapter-read"
                            >
                                قراءة →
                            </span>

                        </a>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   START
========================================================= */

loadChapters();

</script>
