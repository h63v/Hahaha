<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- بيانات العمل التي يقرأها script.js -->
    <meta name="title" content="Solo Leveling">

    <meta name="cover"
        content="https://images.unsplash.com/photo-1613376023733-6891a72bdb3c?auto=format&fit=crop&w=900&q=85">

    <meta name="description"
        content="بعد أن أصبح أضعف صياد في العالم، يحصل سونغ جين وو على قدرة غامضة تسمح له بالتطور بلا حدود.">

    <meta name="genres"
        content="أكشن, فانتازيا, مغامرة">

    <meta name="status"
        content="ongoing">

    <title>Solo Leveling — MangaX</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07070b;
            color: #fff;
            font-family: Arial, Tahoma, sans-serif;
        }

        .header {
            height: 72px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #22222c;
            padding: 0 5%;
        }

        .logo {
            color: #b59cff;
            text-decoration: none;
            font-size: 25px;
            font-weight: 900;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #9999a6;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #b59cff;
        }

        .work {

            display: grid;

            grid-template-columns: 290px 1fr;

            gap: 50px;

            padding: 60px 0 70px;

        }

        .cover {

            width: 290px;

            height: 430px;

            object-fit: cover;

            border-radius: 18px;

            display: block;

            box-shadow:
                0 25px 70px rgba(0,0,0,.45);

        }

        .status {

            display: inline-block;

            background: #16a34a;

            padding: 7px 13px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: bold;

        }

        h1 {

            font-size: 58px;

            margin: 15px 0 20px;

            letter-spacing: -2px;

        }

        .genres {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }

        .genre {

            background: rgba(139,92,246,.10);

            border: 1px solid rgba(139,92,246,.18);

            color: #b59cff;

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 10px;

        }

        .description {

            color: #9999a6;

            line-height: 2;

            max-width: 700px;

            margin: 25px 0;

            font-size: 14px;

        }

        .info {

            display: flex;

            gap: 50px;

            margin-top: 25px;

        }

        .info-item small {

            display: block;

            color: #686873;

            font-size: 10px;

            margin-bottom: 7px;

        }

        .info-item strong {

            font-size: 13px;

        }

        .chapters {

            padding-bottom: 100px;

        }

        .chapters h2 {

            font-size: 25px;

            margin-bottom: 20px;

        }

        .chapter {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            margin-bottom: 9px;

            background: #111119;

            border: 1px solid #22222c;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            transition: .2s;

        }

        .chapter:hover {

            border-color: #8b5cf6;

            transform: translateX(-3px);

        }

        .chapter-number {

            font-size: 13px;

            font-weight: bold;

        }

        .chapter-read {

            color: #b59cff;

            font-size: 11px;

        }

        @media (max-width: 700px) {

            .work {

                grid-template-columns: 1fr;

                justify-items: center;

                text-align: center;

            }

            .work-info {

                display: flex;

                flex-direction: column;

                align-items: center;

            }

            .cover {

                width: 240px;

                height: 350px;

            }

            h1 {

                font-size: 42px;

            }

            .description {

                font-size: 13px;

            }

            .info {

                gap: 30px;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <a href="../../index.html" class="logo">
        MangaX
    </a>

</header>


<main class="container">


    <a href="../../index.html" class="back">
        ← العودة للرئيسية
    </a>


    <section class="work">


        <img
            class="cover"
            src="https://images.unsplash.com/photo-1613376023733-6891a72bdb3c?auto=format&fit=crop&w=900&q=85"
            alt="Solo Leveling"
        >


        <div class="work-info">


            <span class="status">
                مستمر
            </span>


            <h1>
                Solo Leveling
            </h1>


            <div class="genres">

                <span class="genre">
                    أكشن
                </span>

                <span class="genre">
                    فانتازيا
                </span>

                <span class="genre">
                    مغامرة
                </span>

            </div>


            <p class="description">

                بعد أن أصبح أضعف صياد في العالم،
                يحصل سونغ جين وو على قدرة غامضة
                تسمح له بالتطور بلا حدود.

            </p>


            <div class="info">


                <div class="info-item">

                    <small>
                        الحالة
                    </small>

                    <strong>
                        مستمر
                    </strong>

                </div>


                <div class="info-item">

                    <small>
                        عدد الفصول
                    </small>

                    <strong>
                        3
                    </strong>

                </div>


            </div>


        </div>


    </section>


    <section class="chapters">


        <h2>
            الفصول
        </h2>


        <a
            class="chapter"
            href="solo-leveling-chapter-3.html"
        >

            <span class="chapter-number">
                الفصل 3
            </span>

            <span class="chapter-read">
                قراءة ←
            </span>

        </a>


        <a
            class="chapter"
            href="solo-leveling-chapter-2.html"
        >

            <span class="chapter-number">
                الفصل 2
            </span>

            <span class="chapter-read">
                قراءة ←
            </span>

        </a>


        <a
            class="chapter"
            href="solo-leveling-chapter-1.html"
        >

            <span class="chapter-number">
                الفصل 1
            </span>

            <span class="chapter-read">
                قراءة ←
            </span>

        </a>


    </section>


</main>


</body>
    </html>
