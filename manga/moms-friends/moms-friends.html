<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mom’s Friends | MangaX</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top right,
            rgba(139,92,246,.15),
            transparent 35%
        ),
        #08070b;

    color: white;

    font-family:
        Arial,
        Tahoma,
        sans-serif;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.top {
    padding: 35px 0 20px;
}

.back {
    color: #a855f7;
    text-decoration: none;
    font-weight: 700;
}

.hero {
    display: grid;

    grid-template-columns:
        280px 1fr;

    gap: 35px;

    margin-top: 25px;
}

.cover {
    width: 100%;
    aspect-ratio: 2 / 3;

    overflow: hidden;

    border-radius: 22px;

    background: #15141b;

    border:
        1px solid
        rgba(168,85,247,.35);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.45);
}

.cover img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.info {
    padding: 10px 0;
}

.status {
    display: inline-block;

    padding: 9px 16px;

    border-radius: 12px;

    background: #16a34a;

    font-weight: 700;

    margin-bottom: 15px;
}

h1 {
    margin: 0 0 15px;

    font-size:
        clamp(30px, 5vw, 50px);
}

.description {
    color: #aaa8b4;

    line-height: 2;

    font-size: 17px;
}

.genres {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 20px;
}

.genre {
    padding: 8px 14px;

    border-radius: 10px;

    background:
        rgba(139,92,246,.12);

    border:
        1px solid
        rgba(139,92,246,.18);

    color: #c49aff;
}

.section {
    margin: 45px 0;
}

.section h2 {
    margin-bottom: 18px;
}

.chapters {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.chapter {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 20px;

    border-radius: 15px;

    background: #121118;

    border:
        1px solid
        rgba(255,255,255,.07);

    color: white;

    text-decoration: none;

    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}

.chapter:hover {
    transform: translateY(-2px);

    border-color:
        rgba(139,92,246,.5);

    background: #181620;
}

.chapter span:last-child {
    color: #a855f7;

    font-weight: 700;
}

@media (max-width: 700px) {

    .hero {
        grid-template-columns: 1fr;
    }

    .cover {
        max-width: 280px;

        margin: auto;
    }

    h1 {
        text-align: center;
    }

    .status {
        display: block;

        width: fit-content;

        margin: 0 auto 15px;
    }

    .description {
        text-align: center;
    }

    .genres {
        justify-content: center;
    }

}

</style>
</head>

<body>

<div class="container">

<header class="top">

<a class="back" href="/">
    ← العودة إلى الأعمال
</a>

</header>


<section class="hero">

<div class="cover">

<img
    src="https://b.top4top.io/p_3878uxxge1.jpg"
    alt="Mom’s Friends"
>

</div>


<div class="info">

<span class="status">
    مستمر
</span>

<h1>
    Mom’s Friends
</h1>

<p class="description">
    استمتع بقراءة جميع فصول Mom’s Friends على MangaX.
</p>


<div class="genres">

<span class="genre">
    دراما
</span>

<span class="genre">
    رومانسي
</span>

<span class="genre">
    ميلف
</span>

</div>

</div>

</section>


<section class="section">

<h2>
    الفصول
</h2>


<div class="chapters">

<script>

const totalChapters = 27;

for (
    let i = totalChapters;
    i >= 1;
    i--
) {

    document.write(`

        <a
            class="chapter"
            href="moms-friends-chapter-${i}.html"
        >

            <span>
                Mom’s Friends
            </span>

            <span>
                الفصل ${i}
            </span>

        </a>

    `);

}

</script>

</div>

</section>

</div>

</body>
</html>
